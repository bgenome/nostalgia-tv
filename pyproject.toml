[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nostalgia-tv"
version = "1.0.0"
description = "Dedicated Raspberry Pi retro TV appliance connected via HDMI, controlled by your TV remote over HDMI-CEC."
readme = "README.md"
authors = [{ name = "bgenome", email = "guybelo@me.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "raspberry-pi",
    "hdmi-cec",
    "tv-remote",
    "retro-tv",
    "crt",
    "kiosk",
    "libmpv",
    "pyqt6",
    "broadcast-engine",
    "tv-appliance",
    "plex",
    "90s",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
kiosk = [
    "PyQt6>=6.5.0",
    "python-mpv>=1.0.5",
    "pyyaml>=6.0.1",
]
kiosk-cec = [
    "cec>=0.2.8",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/bgenome/nostalgia-tv"
"Bug Tracker" = "https://github.com/bgenome/nostalgia-tv/issues"
"Documentation" = "https://github.com/bgenome/nostalgia-tv#readme"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "env",
    "downloads",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
